<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYVO Creator</title><style>body{margin:0;background:#080a09;color:#eee;font:16px Arial}header{padding:15px 18px;background:#101410;display:flex;gap:14px;align-items:center}b{font-size:23px;color:#b8ff3d}.wrap{max-width:1100px;margin:auto;padding:18px}.tools{display:flex;flex-wrap:wrap;gap:8px}.card{background:#121612;border:1px solid #293029;border-radius:12px;padding:12px}button,input,textarea{background:#171c17;color:#fff;border:1px solid #394139;border-radius:8px;padding:10px}button{cursor:pointer}.editor{height:58vh;background:#0e130e;border:1px solid #374137;position:relative;overflow:hidden;margin-top:12px}.obj{position:absolute;min-width:32px;text-align:center;cursor:move}.selected{outline:2px solid #b8ff3d}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}</style></head><body><header><b>ZYVO Creator</b><span>Створюй ігри для ZYVO</span></header><main class=wrap><div class=card><div class=row><input id=title placeholder="Назва гри"><input id=creator placeholder="Автор"><input id=thumb placeholder="Емодзі прев'ю"><input id=desc placeholder="Опис"></div><div class=tools><button onclick="tool('Block')">🧱 Block</button><button onclick="tool('Wall')">⬛ Wall</button><button onclick="tool('Spawn')">🟢 Spawn</button><button onclick="tool('Coin')">🪙 Coin</button><button onclick="tool('Goal')">🏁 Goal</button><button onclick="tool('Reset Zone')">🔄 Reset Zone</button><button onclick="save()">💾 Save</button><button onclick="publish()">🚀 Publish</button><button onclick="test()">▶ Test</button></div></div><div id=editor class=editor></div><div class=card><h3>Правила</h3><p>Ти не створюєш персонажа. Додай хоча б один <b>Spawn</b> — гравці автоматично з'являться там зі стандартним ZYVO-персонажем.</p><textarea id=json style="width:100%;height:120px" readonly></textarea></div></main><script>let world=[],active='Block',drag=null;const ed=document.getElementById('editor');function tool(t){active=t}function add(x,y){let o={id:Date.now()+Math.random(),type:active,x:x/ed.clientWidth*100,y:y/ed.clientHeight*100};world.push(o);render()}function render(){ed.innerHTML='';world.forEach(o=>{let e=document.createElement('div');e.className='obj';e.style.left=o.x+'%';e.style.top=o.y+'%';e.textContent=o.type==='Spawn'?'🟢':o.type==='Coin'?'🪙':o.type==='Goal'?'🏁':o.type==='Reset Zone'?'🔄':o.type==='Wall'?'⬛':'🧱';e.onpointerdown=a=>{drag={o,ox:a.clientX,oy:a.clientY};e.setPointerCapture(a.pointerId)};e.onpointermove=a=>{if(!drag||drag.o!==o)return;o.x=Math.max(0,Math.min(100,o.x+(a.clientX-drag.ox)/ed.clientWidth*100));o.y=Math.max(0,Math.min(100,o.y+(a.clientY-drag.oy)/ed.clientHeight*100));drag.ox=a.clientX;drag.oy=a.clientY;render()};e.onpointerup=()=>drag=null;ed.append(e)});json.value=JSON.stringify(world,null,2)}ed.onclick=e=>{if(e.target===ed)add(e.offsetX,e.offsetY)};function save(){localStorage.zyvoWorld=JSON.stringify(world);alert('Збережено')}function test(){alert(world.some(x=>x.type==='Spawn')?'Тест запущено. Spawn знайдено.':'Додай Spawn перед тестом.')}async function publish(){if(!world.some(x=>x.type==='Spawn'))return alert('Додай хоча б один Spawn.');let base=prompt('URL ZYVO Platform',localStorage.zyvoPlatform||'');if(!base)return;localStorage.zyvoPlatform=base;let secret=prompt('CREATOR_SECRET');try{let r=await fetch(base.replace(/\/$/,'')+'/api/games',{method:'POST',headers:{'Content-Type':'application/json','x-creator-secret':secret},body:JSON.stringify({title:title.value||'Без назви',creator:creator.value||'Creator',thumbnail:thumb.value||'🎮',description:desc.value||'',world})});let j=await r.json();if(!r.ok)throw Error(j.error||'Помилка');alert('Опубліковано! ID: '+j.id)}catch(e){alert(e.message)}}if(localStorage.zyvoWorld){try{world=JSON.parse(localStorage.zyvoWorld)}catch{}}render()</script></body></html>
