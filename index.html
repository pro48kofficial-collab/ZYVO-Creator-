<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>ZYVO Creator 3D</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

<header class="topbar">

  <div class="brand">
    ZYVO
    <span>Creator 3D</span>
  </div>

  <input
    id="projectName"
    value="MyWorld"
    maxlength="80"
  >

  <div class="top-actions">

    <button id="newBtn">
      Новий
    </button>

    <button id="openBtn">
      Імпорт
    </button>

    <button id="saveBtn">
      Експорт .zyvo
    </button>

    <button
      id="publishBtn"
      class="accent"
    >
      Зберегти
    </button>

    <input
      id="fileInput"
      type="file"
      accept=".zyvo,.glb"
      hidden
    >

  </div>

</header>

<main class="workspace">

  <aside class="left-panel">

    <section>

      <h3>Об'єкти</h3>

      <button
        class="wide"
        data-add="box"
      >
        ＋ Куб
      </button>

      <button
        class="wide"
        data-add="sphere"
      >
        ＋ Сфера
      </button>

      <button
        class="wide"
        data-add="cylinder"
      >
        ＋ Циліндр
      </button>

      <button
        class="wide"
        data-add="plane"
      >
        ＋ Площина
      </button>

    </section>

    <section>

      <h3>Інструмент</h3>

      <button
        class="wide"
        data-tool="translate"
      >
        Перемістити
      </button>

      <button
        class="wide"
        data-tool="rotate"
      >
        Обертати
      </button>

      <button
        class="wide"
        data-tool="scale"
      >
        Масштаб
      </button>

    </section>

    <section>

      <h3>Сцена</h3>

      <label class="check">
        <input
          id="gridToggle"
          type="checkbox"
          checked
        >
        Сітка
      </label>

      <label class="check">
        <input
          id="snapToggle"
          type="checkbox"
        >
        Прив'язка
      </label>

    </section>

  </aside>

  <section class="viewport-wrap">

    <div id="viewport"></div>

    <div class="viewport-hud">

      <span>
        ЛКМ: вибір
      </span>

      <span>
        ПКМ: огляд
      </span>

      <span>
        Колесо: масштаб
      </span>

    </div>

  </section>

  <aside class="right-panel">

    <section>

      <h3>Ієрархія</h3>

      <div
        id="objectList"
        class="object-list"
      ></div>

    </section>

    <section>

      <h3>Властивості</h3>

      <div id="noSelection">
        Вибери об'єкт
      </div>

      <div
        id="propertyForm"
        class="hidden"
      >

        <label>
          Назва
          <input id="objName">
        </label>

        <label>
          Колір
          <input
            id="objColor"
            type="color"
            value="#7cff00"
          >
        </label>

        <label>
          Прозорість
          <input
            id="objOpacity"
            type="range"
            min="0.1"
            max="1"
            step="0.05"
            value="1"
          >
        </label>

        <b>Позиція</b>

        <div class="triple">

          <input
            id="px"
            type="number"
            step=".1"
          >

          <input
            id="py"
            type="number"
            step=".1"
          >

          <input
            id="pz"
            type="number"
            step=".1"
          >

        </div>

        <b>Поворот</b>

        <div class="triple">

          <input
            id="rx"
            type="number"
            step="1"
          >

          <input
            id="ry"
            type="number"
            step="1"
          >

          <input
            id="rz"
            type="number"
            step="1"
          >

        </div>

        <b>Масштаб</b>

        <div class="triple">

          <input
            id="sx"
            type="number"
            step=".1"
          >

          <input
            id="sy"
            type="number"
            step=".1"
          >

          <input
            id="sz"
            type="number"
            step=".1"
          >

        </div>

        <button
          id="textureBtn"
          class="wide"
        >
          Завантажити текстуру
        </button>

        <input
          id="textureInput"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          hidden
        >

        <button
          id="duplicateBtn"
          class="wide"
        >
          Дублювати
        </button>

        <button
          id="deleteBtn"
          class="wide danger"
        >
          Видалити
        </button>

      </div>

    </section>

    <section>

      <p class="muted">
        .zyvo — власний формат ZYVO.
        У ньому зберігається сцена,
        об'єкти, матеріали й текстури.
      </p>

    </section>

  </aside>

</main>

<footer class="statusbar">

  <span id="status">
    Готово
  </span>

  <span id="objectCount">
    0 об'єктів
  </span>

</footer>

<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>

<script
  type="module"
  src="app.js"
></script>

</body>
</html>
