<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ZYVO Creator 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ZYVO <span>Creator 3D</span></div>
  <input id="projectName" value="MyWorld" maxlength="80">
  <div class="top-actions">
    <button id="newBtn">Новий</button>
    <button id="saveBtn">Зберегти</button>
    <button id="exportBtn">.ZYVO</button>
    <button id="glbBtn">GLB</button>
    <button id="openBtn">Імпорт</button>
    <button id="playBtn" class="accent">▶ Грати</button>
    <button id="publishBtn" class="accent">Опублікувати</button>
    <input id="fileInput" type="file" accept=".zyvo,.glb" hidden>
  </div>
</header>

<main class="workspace">
  <aside class="left-panel">
    <h3>Модельки</h3>
    <button class="wide" data-add="box">🧱 Куб</button>
    <button class="wide" data-add="sphere">⚪ Сфера</button>
    <button class="wide" data-add="cylinder">🔵 Циліндр</button>
    <button class="wide" data-add="cone">🔺 Конус</button>
    <button class="wide" data-add="torus">⭕ Кільце</button>
    <button class="wide" data-add="tree">🌳 Дерево</button>
    <button class="wide" data-add="table">🪑 Стіл</button>
    <button class="wide" data-add="chair">💺 Стілець</button>
    <button class="wide" data-add="car">🚗 Машина</button>
    <button class="wide" data-add="plane">✈️ Літак</button>
    <button class="wide" data-add="weapon">🔫 Зброя</button>
    <button class="wide" data-add="spawn">🟢 Spawn</button>

    <h3>Інструменти</h3>
    <button class="wide" data-tool="translate">↔ Переміщення</button>
    <button class="wide" data-tool="rotate">⟳ Обертання</button>
    <button class="wide" data-tool="scale">⤢ Масштаб</button>

    <h3>Сцена</h3>
    <label class="check"><input id="gridToggle" type="checkbox" checked> Сітка</label>
    <label class="check"><input id="snapToggle" type="checkbox"> Прив'язка</label>
    <label class="check"><input id="multiplayerToggle" type="checkbox" checked> Мультиплеєр</label>
  </aside>

  <section class="viewport-wrap">
    <div id="viewport"></div>
    <div class="viewport-hud">
      <span>ЛКМ: вибір</span>
      <span>ПКМ: огляд</span>
      <span>Колесо: масштаб</span>
    </div>
  </section>

  <aside class="right-panel">
    <h3>Ієрархія</h3>
    <div id="objectList" class="object-list"></div>

    <h3>Властивості</h3>
    <div id="noSelection">Вибери об'єкт</div>
    <div id="propertyForm" class="hidden">
      <label>Назва<input id="objName"></label>
      <label>Колір<input id="objColor" type="color" value="#7cff00"></label>
      <label>Прозорість<input id="objOpacity" type="range" min=".1" max="1" step=".05" value="1"></label>

      <b>Позиція</b>
      <div class="triple"><input id="px" type="number" step=".1"><input id="py" type="number" step=".1"><input id="pz" type="number" step=".1"></div>
      <b>Поворот</b>
      <div class="triple"><input id="rx" type="number" step="1"><input id="ry" type="number" step="1"><input id="rz" type="number" step="1"></div>
      <b>Масштаб</b>
      <div class="triple"><input id="sx" type="number" step=".1"><input id="sy" type="number" step=".1"><input id="sz" type="number" step=".1"></div>

      <button id="textureBtn" class="wide">🖼 Текстура</button>
      <input id="textureInput" type="file" accept="image/*" hidden>
      <button id="duplicateBtn" class="wide">Копіювати</button>
      <button id="deleteBtn" class="wide danger">Видалити</button>
    </div>
  </aside>
</main>

<footer class="statusbar">
  <span id="status">Готово</span>
  <span id="objectCount">0 об'єктів</span>
</footer>

<div id="publishModal" class="modal hidden">
  <div class="modal-card">
    <h2>Публікація гри</h2>
    <label>Назва гри<input id="pubName" maxlength="60"></label>
    <label>Аватарка гри<input id="pubAvatar" type="file" accept="image/*"></label>
    <label>Банер<input id="pubBanner" type="file" accept="image/*"></label>
    <label>Опис<textarea id="pubDescription" maxlength="500"></textarea></label>
    <label class="check"><input id="pubMultiplayer" type="checkbox" checked> Мультиплеєр</label>
    <div class="modal-actions">
      <button id="closePublish">Скасувати</button>
      <button id="confirmPublish" class="accent">Опублікувати</button>
    </div>
  </div>
</div>

<div id="gameOverlay" class="game-overlay hidden">
  <div class="game-top">
    <span id="gameTitle">ZYVO GAME</span>
    <button id="cameraBtn">1P / 3P</button>
    <button id="exitGame">Вийти</button>
  </div>
  <div id="gameViewport"></div>
  <div id="nicknameLayer"></div>
  <button id="jumpBtn" class="mobile-control jump">JUMP</button>
  <div id="joystick" class="joystick"><div></div></div>
  <div class="crosshair">+</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
