<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYVO Creator</title><link rel="stylesheet" href="style.css"></head><body><div id="loading"><b>ZYVO</b><div><i id="loadFill"></i></div><span>Завантаження редактора...</span></div><header><strong>ZYVO Creator</strong><button id="playBtn">▶ Грати</button><button id="saveBtn">💾 Зберегти</button><button id="publishBtn">🚀 Опублікувати</button></header><main><aside class="left"><h3>Об'єкти</h3><button data-add="block">🧱 Куб</button><button data-add="sphere">⚪ Сфера</button><button data-add="cylinder">🔵 Циліндр</button><button data-add="tree">🌳 Дерево</button><button data-add="table">🪑 Стіл</button><button data-add="chair">💺 Стілець</button><button data-add="car">🚗 Машина</button><button data-add="plane">✈️ Літак</button><button data-add="weapon">🔫 Зброя</button><button data-add="spawn">🟢 Spawn</button><hr><button id="importBtn">📥 Імпорт</button><button id="exportBtn">📦 .zyvo</button><button id="glbBtn">📤 GLB</button><input id="fileInput" type="file" accept=".zyvo,.glb" hidden></aside><section class="viewport"><div id="scene"></div><div id="crosshair">+</div><div id="hint">WASD — рух • Space — стрибок • Грати — тест</div><div id="mobileControls"><div id="joy"></div><button id="jump">⬆</button><button id="viewBtn">👁</button></div></section><aside class="right"><h3>Інспектор</h3><div id="emptyInspector">Вибери об'єкт</div><div id="inspector" hidden><label>Назва<input id="objName"></label><label>X<input id="px" type="number" step=".1"></label><label>Y<input id="py" type="number" step=".1"></label><label>Z<input id="pz" type="number" step=".1"></label><label>Масштаб<input id="scale" type="number" step=".1"></label><label>Текстура<input id="texture" type="file" accept="image/*"></label><button id="deleteBtn">🗑 Видалити</button></div></aside></main><dialog id="publishDialog"><form method="dialog" id="publishForm"><h2>Публікація</h2><input id="gameTitle" placeholder="Назва гри" required><input id="gameAvatar" type="file" accept="image/*"><input id="gameBanner" type="file" accept="image/*"><textarea id="gameDescription" placeholder="Опис"></textarea><label><input id="multiplayer" type="checkbox"> Мультиплеєр</label><button id="confirmPublish">🚀 Опублікувати</button></form></dialog><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/exporters/GLTFExporter.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.js"></script><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
